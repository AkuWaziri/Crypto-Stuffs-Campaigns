name: EVM Live Observation

on:
  workflow_dispatch:
    inputs:
      query:
        description: DexScreener discovery query
        required: false
        default: WETH
      limit:
        description: Maximum candidates
        required: false
        default: "5"
  schedule:
    - cron: "*/10 * * * *"

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Live observation and Telegram feed
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVM_DISCOVERY_QUERY: ${{ inputs.query || 'WETH' }}
          EVM_OBSERVATION_LIMIT: ${{ inputs.limit || '5' }}
        run: PYTHONPATH=. python live_runner.py
