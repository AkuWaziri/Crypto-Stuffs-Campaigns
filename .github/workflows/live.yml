name: WhalesBoarder Live Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      VYBE_API_KEY: ${{ secrets.VYBE_API_KEY }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      BITQUERY_API_KEY: ${{ secrets.BITQUERY_API_KEY }}
      SOLANA_MIN_BUY_USD: '200'
      SOLANA_MAJOR_BUY_MIN_USD: '5000'
      SOLANA_MAJOR_BUY_MAX_USD: '10000'
      SOLANA_REPEAT_MIN_USD: '1000'
      SOLANA_REPEAT_MAX_USD: '5000'
      SOLANA_EMERGING_MAX_USD: '2000'
      SOLANA_WINDOW_MINUTES: '30'
      SOLANA_MAX_TRADES: '200'
      EVM_MIN_BUY_USD: '200'
      EVM_MAX_BUY_USD: '2000'
      EVM_MAJOR_BUY_MIN_USD: '5000'
      EVM_MAJOR_BUY_MAX_USD: '10000'
      LIVE_WINDOW_MINUTES: '10'
      LIVE_MAX_EVENTS: '10'
      EVM_NETWORKS: 'eth,base,bsc,arbitrum,polygon'
    steps:
      - uses: actions/checkout@v4

      - name: Restore live deduplication state
        uses: actions/cache@v4
        with:
          path: .whalesboarder_state.json
          key: whalesboarder-state-${{ github.run_id }}
          restore-keys: |
            whalesboarder-state-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run live whale feed
        run: python main.py --live --telegram
