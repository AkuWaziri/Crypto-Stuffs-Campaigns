name: TrendsBot Observation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run read-only observation
        env:
          PYTHONPATH: .
          TRENDSBOT_MODE: observation
          SCAN_INTERVAL_MINUTES: "240"
          MAX_SIGNAL_AGE_MINUTES: "5"
          MAX_LAUNCHES_PER_CYCLE: "2"
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python run_observation.py
