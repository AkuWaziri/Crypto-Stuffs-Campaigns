name: TrendsBot Twitter Daily

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC = 07:00 WAT (UTC+1)
    - cron: "0 6 * * *"
    # 16:00 UTC = 17:00 WAT (UTC+1)
    - cron: "0 16 * * *"

jobs:
  twitter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily Twitter/X trend feed
        env:
          PYTHONPATH: .
          TWITTERAPIS_KEY: ${{ secrets.TWITTERAPIS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_twitter_observation.py
