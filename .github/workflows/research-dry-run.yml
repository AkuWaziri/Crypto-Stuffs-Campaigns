name: Research Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-stuffs-research-dry-run
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b
      MAX_GROQ_CALLS_PER_RUN: "3"
      X_SEARCH_LIMIT: "10"
      MAX_FEED_ITEMS: "3"
      HIGH_PERFORMANCE_MAX_ITEMS: "10"
      LOOKBACK_HOURS: "168"
      ENABLE_WEB_SOURCES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile project modules
        run: python -m py_compile main.py discovery.py high_performance.py web_sources.py config.py telegram.py editorial.py evidence_checks.py research_engine.py research_records.py
      - name: Run tests
        run: pytest -q
      - name: Retrieve sources and generate drafts without Telegram delivery
        run: python main.py --test
      - name: Upload dry-run audit records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-dry-run-records-${{ github.run_id }}
          path: .research_records.json
          if-no-files-found: ignore
          retention-days: 7
