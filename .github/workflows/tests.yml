name: Crypto-Stuffs-Campaigns Tests

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile new project modules
        run: python -m py_compile classifier.py config.py feed.py main.py state.py telegram.py web_sources.py x_scraper.py editorial.py
      - name: Run editorial unit tests
        run: pytest -q tests/test_editorial.py
      - name: Run smoke tests
        run: |
          python - <<'PY'
          from classifier import classify, is_relevant

          item = {
              "source": "x",
              "author": "test",
              "text": "crypto be like: the chart dumps 20% and everyone becomes a long-term investor",
              "url": "https://x.com/test/status/1",
          }
          result = classify(item)
          assert is_relevant(result)
          assert "funny_creative_crypto" in result["types"]
          print("smoke_tests=passed")
          PY
