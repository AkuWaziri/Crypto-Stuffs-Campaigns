name: Crypto-Stuffs-Campaigns Tests

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile project modules
        run: python -m py_compile classifier.py config.py discovery.py high_performance.py main.py telegram.py web_sources.py editorial.py
      - name: Run smoke tests
        run: |
          python - <<'PY'
          import main
          from classifier import classify, is_relevant

          item = {
              "id": "x:https://x.com/test/status/1",
              "source": "x",
              "author": "test",
              "text": "On-chain investigators traced suspicious wallet movements after an exploit.",
              "url": "https://x.com/test/status/1",
          }
          result = classify(item)
          assert is_relevant(result)
          assert "security" in result["types"] or "research" in result["types"]

          # Keep CI smoke tests independent of API credentials and network calls.
          main.write_finding = lambda value: (
              value["text"] + "\n\nSource: " + value["url"]
          )
          message = main._format_finding(item)
          assert message.startswith(item["text"])
          assert "Source: https://x.com/test/status/1" in message
          print("smoke_tests=passed")
          PY
