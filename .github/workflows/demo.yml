name: WhalesBoarder Demo

on:
  workflow_dispatch:
  push:
    paths:
      - 'demo_data.py'
      - 'pipeline.py'
      - 'feed.py'
      - 'reason_engine.py'
      - 'score.py'
      - 'main.py'
      - '.github/workflows/demo.yml'

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run complete offline pipeline
        run: python main.py --demo
