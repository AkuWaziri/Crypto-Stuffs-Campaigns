name: Crypto-Stuffs-Campaigns Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  feed:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
      X_SEARCH_LIMIT: "20"
      MAX_FEED_ITEMS: "10"
      LOOKBACK_HOURS: "36"
      ENABLE_WEB_SOURCES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run campaign feed
        run: python main.py --telegram
