name: Crypto-Stuffs-Campaigns Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: crypto-stuffs-campaign-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4o-mini
      X_SEARCH_LIMIT: "20"
      MAX_FEED_ITEMS: "30"
      HIGH_PERFORMANCE_MAX_ITEMS: "20"
      LOOKBACK_HOURS: "168"
      ENABLE_WEB_SOURCES: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Restore campaign deduplication state
        uses: actions/cache@v4
        with:
          path: .campaign_state.json
          key: crypto-stuffs-campaign-state-v4-${{ github.run_id }}
          restore-keys: |
            crypto-stuffs-campaign-state-v4-
            crypto-stuffs-campaign-state-v3-
            crypto-stuffs-campaign-state-v2-
            crypto-stuffs-campaign-state-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile project modules
        run: python -m py_compile main.py discovery.py high_performance.py web_sources.py config.py telegram.py editorial.py
      - name: Run tests
        run: pytest -q
      - name: Run findings feed
        run: python main.py --telegram
