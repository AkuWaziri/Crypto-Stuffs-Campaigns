name: Crypto-Stuffs-Campaigns Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */5 * * *"

concurrency:
  group: crypto-stuffs-campaign-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b
      MAX_GROQ_CALLS_PER_RUN: "30"
      X_SEARCH_LIMIT: "20"
      MAX_FEED_ITEMS: "10"
      HIGH_PERFORMANCE_MAX_ITEMS: "20"
      LOOKBACK_HOURS: "168"
      ENABLE_WEB_SOURCES: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Restore campaign deduplication state
        uses: actions/cache@v4
        with:
          path: |
            .campaign_state.json
            .research_records.json
          key: crypto-stuffs-campaign-state-v4-${{ github.run_id }}
          restore-keys: |
            crypto-stuffs-campaign-state-v4-
            crypto-stuffs-campaign-state-v3-
            crypto-stuffs-campaign-state-v2-
            crypto-stuffs-campaign-state-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify delivery credentials
        run: |
          python - <<'PY'
          import os
          import sys

          required = ("GROQ_API_KEY", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID")
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              print("Missing required GitHub Actions secrets: " + ", ".join(missing))
              sys.exit(1)
          optional = ("X_AUTH_TOKEN", "X_CT0")
          absent_optional = [name for name in optional if not os.getenv(name)]
          if absent_optional:
              print("Warning: X source credentials missing; X discovery may be limited.")
          print("Required Groq and Telegram credentials are present.")
          PY
      - name: Compile project modules
        run: python -m py_compile main.py discovery.py high_performance.py web_sources.py config.py telegram.py editorial.py evidence_checks.py research_engine.py research_records.py
      - name: Run tests
        run: pytest -q
      - name: Run findings feed
        run: python main.py --telegram
